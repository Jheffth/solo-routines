<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Vitrine: Escudos Lunares S-Rank</title>
  <link rel="stylesheet" href="css/design-system.css">
  <style>
    body {
      margin: 0; padding: 40px;
      background: #0a0d11; color: #fff;
      font-family: 'Inter', sans-serif;
      text-align: center;
    }
    h1 {
      margin-bottom: 50px;
      font-family: 'Cinzel', serif;
      font-size: 2.5rem;
      color: #fbbf24;
      text-shadow: 0 4px 15px rgba(0,0,0,0.8);
    }
    .vitrine {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .rank-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transition: transform 0.3s;
    }
    .rank-card:hover {
      transform: translateY(-5px);
      background: rgba(255,255,255,0.05);
      border-color: rgba(255,255,255,0.2);
    }
    .rank-label {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #a1a1aa;
    }
    .rank-card[data-rank="N"] .rank-label { color: #fb7185; }
    .rank-card[data-rank="S"] .rank-label { color: #fbbf24; }
    .rank-card[data-rank="A"] .rank-label { color: #a855f7; }
    .rank-card[data-rank="B"] .rank-label { color: #3b82f6; }
    .rank-card[data-rank="C"] .rank-label { color: #10b981; }
    .rank-card[data-rank="D"] .rank-label { color: #22d3ee; }
  </style>
  <script src="js/escudos.js"></script>
</head>
<body>

  <h1>Forja: Escudos Lunares</h1>

  <div class="vitrine" id="vitrine-grid"></div>

  <script>
    const ranks = ['E', 'D', 'C', 'B', 'A', 'S', 'N'];
    const nomes = {
      'E': 'Rank 1', 'D': 'Rank 2', 'C': 'Rank 3', 
      'B': 'Rank 4 (S/ Halo)', 'A': 'Rank 5 (C/ Halo)', 
      'S': 'Rank 6', 'N': 'Rank 7 (Nacional)'
    };
    
    const grid = document.getElementById('vitrine-grid');

    ranks.forEach(r => {
      const card = document.createElement('div');
      card.className = 'rank-card';
      card.dataset.rank = r;

      const svg = Escudos.rank(r, 220); // Renderiza a 220px de largura/altura
      
      card.innerHTML = `
        <div class="escudo-container">${svg}</div>
        <div class="rank-label">${nomes[r]}</div>
      `;
      grid.appendChild(card);
    });
  </script>

</body>
</html>
