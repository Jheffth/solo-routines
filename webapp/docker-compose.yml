name: solo-app

# ══════════════════════════════════════════════════════════════════
#  OS SEGREDOS SAÍRAM DAQUI.
#
#  Este arquivo é versionado. Até agora ele carregava, em texto puro, a
#  senha do Postgres e a SECRET_KEY de produção — a chave que assina os
#  tokens. Quem clonasse o repositório assinava token de qualquer usuário,
#  inclusive o do Arquiteto. Não é uma falha teórica: é a diferença entre
#  "precisa da sua senha" e "precisa de trinta segundos".
#
#  Agora os valores vêm de `webapp/.env`, que o .gitignore já barra. O
#  Compose lê esse arquivo sozinho para resolver os `${...}` abaixo — não
#  precisa de `env_file:`, e nada muda no jeito de subir.
#
#  ORDEM OBRIGATÓRIA NO SERVIDOR: criar `/root/app/webapp/.env` ANTES do
#  próximo `docker compose up`. Sem o arquivo, a SECRET_KEY chega vazia, o
#  config.py levanta RuntimeError de propósito (para não assinar token com
#  chave improvisada) e o contêiner não sobe. `webapp/.env.example` tem o
#  molde. O site continua no ar até você reconstruir — dá tempo.
#
#  E TROQUE OS DOIS VALORES ao movê-los. Eles estiveram no git; tirar do
#  arquivo não os tira do histórico. Enquanto forem os mesmos, continuam
#  comprometidos.
# ══════════════════════════════════════════════════════════════════

services:
  api:
    build:
      context: .
      args:
        # Vazios por padrão. O caminho normal do selo é o
        # backend/build_info.json gravado por scripts/selar_build.py;
        # estes só existem para um CI passar os valores direto.
        APP_VERSAO: ${APP_VERSAO:-}
        APP_SHA: ${APP_SHA:-}
    container_name: solo_routines
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@solo_db:5432/${POSTGRES_DB}
      - SECRET_KEY=${SECRET_KEY}
      # Cifra o refresh token do Google Calendar. Vazia = o botao de
      # conectar agenda nao aparece, e o resto do app segue igual.
      - CALENDARIO_CHAVE=${CALENDARIO_CHAVE:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TELEGRAM_SECRET=${TELEGRAM_SECRET:-}
      - AMBIENTE=${AMBIENTE:-production}
      # A CASA, separada do REGIME. O rodapé anunciou "RENDER" de dentro do
      # Contabo durante meses porque o front traduzia "production" para o
      # nome do hospedeiro antigo, cravado em JavaScript. Agora quem diz
      # onde o app está é o próprio servidor.
      - HOSPEDEIRO=${HOSPEDEIRO:-Contabo}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://soloroutines.duckdns.org}
      - OAUTH_REDIRECT_BASE=${OAUTH_REDIRECT_BASE:-https://soloroutines.duckdns.org}

      # ── BOTS ──────────────────────────────────────────────────────
      #
      # ESTA LISTA FALTAVA INTEIRA, e o defeito era do tipo mais caro de
      # achar: nada quebrava. O `.env.example` documentava as variaveis,
      # o Arquiteto as preencheria em `/root/app/webapp/.env`, e o Compose
      # simplesmente nao as repassaria — porque este servico nao usa
      # `env_file:`, so a lista explicita acima.
      #
      # Dentro do conteiner `os.getenv("TELEGRAM_BOT_TOKEN")` devolveria
      # "", `bots/status` responderia `disponivel: false`, e a aba Bots
      # diria para sempre "o servidor nao tem TELEGRAM_BOT_TOKEN
      # configurado" — apontando exatamente para o arquivo onde o token
      # ESTA. Nenhum log, nenhuma excecao, e a pista acusando o inocente.
      #
      # `:-` em todas: bot e opcional. Vazio = a aba Bots explica o que
      # falta, e o resto do app nao muda.
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      # So para montar o link t.me/<usuario> no passo 1 da aba.
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME:-}
      # Lista de espera opcional (ids separados por virgula), NAO a
      # autorizacao — quem autoriza e o codigo de seis digitos.
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      # O Telegram devolve este segredo em cada webhook. Sem ele o
      # endpoint recusa tudo: ver a nota em routers/bot_telegram.py.
      - TELEGRAM_SECRET=${TELEGRAM_SECRET:-}

      # Os defaults repetem os de `motors/evolution.py` de proposito: uma
      # variavel PASSADA VAZIA vence o default do `os.getenv`, entao
      # escrever `${X:-}` aqui APAGARIA o default do modulo em vez de
      # respeita-lo. Quem decide se o WhatsApp existe e a API_KEY.
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-http://whatsapp:8080}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-}
      - EVOLUTION_INSTANCE=${EVOLUTION_INSTANCE:-solo_rotinas}
      - EVOLUTION_WEBHOOK=${EVOLUTION_WEBHOOK:-http://api:8000/api/whats/webhook}
    volumes:
      - solo_uploads:/app/backend/uploads
    networks:
      - solo-network

  whatsapp:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api
    restart: always
    environment:
      - SERVER_URL=http://whatsapp:8080
      - DOCKER_ENV=true
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://admin:Db_Solo_2026%21@solo_db:5432/solo_routines_db
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - solo-network
networks:
  solo-network:
    external: true

volumes:
  evolution_instances:
  solo_uploads:







